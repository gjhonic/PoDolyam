name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: .\scripts\windows.cmd install
      - run: .\scripts\windows.cmd test
      - run: .\scripts\windows.cmd build
  race:
    name: Расчёты и SQLite с race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./internal/money ./internal/local
        working-directory: backend
  required:
    name: CI required
    if: ${{ always() }}
    needs: [desktop, race]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Все обязательные проверки успешны
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$DESKTOP_RESULT" = success
          test "$RACE_RESULT" = success
